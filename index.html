<!doctype html>
<html lang="id" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" as="image" href="/images/optimized/logo-sma-smk-yatkj-ui.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hadirkan pengalaman absensi sekolah yang lebih mudah, tertata, dan terhubung untuk seluruh warga sekolah." />
    <meta name="author" content="Randhu Paksi Membumi" />
    <meta name="creator" content="Randhu Paksi Membumi" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Absensi Citra Negara" />
    <meta property="og:title" content="Absensi Citra Negara" />
    <meta property="og:description" content="Hadirkan pengalaman absensi sekolah yang lebih mudah, tertata, dan terhubung untuk seluruh warga sekolah." />
    <meta property="og:url" content="https://absensmk.citranegara.online/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Absensi Citra Negara" />
    <meta name="twitter:description" content="Hadirkan pengalaman absensi sekolah yang lebih mudah, tertata, dan terhubung untuk seluruh warga sekolah." />
    <meta name="theme-color" content="#047857" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        try {
          var supports = window.CSS && window.CSS.supports;
          var mode = supports &&
            supports("color", "color-mix(in srgb, red, blue)") &&
            (supports("backdrop-filter", "blur(1px)") || supports("-webkit-backdrop-filter", "blur(1px)"))
            ? "standard"
            : "compat";
          document.documentElement.setAttribute("data-render-mode", mode);
        } catch (_) {
          document.documentElement.setAttribute("data-render-mode", "compat");
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("absensi-cn-theme") === "dark" ? "dark" : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", theme === "dark" ? "#101b2a" : "#047857");
        } catch (_) {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <script>
      try {
        if (location.pathname === "/" && !localStorage.getItem("absensi-cn-auth")) {
          const heroPreload = document.createElement("link");
          heroPreload.rel = "preload";
          heroPreload.as = "image";
          heroPreload.href = "/images/optimized/cn-hero.jpg";
          heroPreload.imageSrcset = "/images/optimized/cn-panel.jpg 960w, /images/optimized/cn-hero.jpg 1920w";
          heroPreload.imageSizes = "100vw";
          heroPreload.fetchPriority = "high";
          document.head.appendChild(heroPreload);
        }
      } catch (_) {
        // Storage can be unavailable in strict privacy mode; the page still loads normally.
      }
    </script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(167, 243, 208, 0.36), transparent 34%),
          linear-gradient(180deg, #f8fbf8 0%, #eef7f1 100%);
        opacity: 1;
        visibility: visible;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #initial-loader.is-ready {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #initial-loader.is-error .initial-loader__logo {
        border-color: rgba(251, 191, 36, 0.7);
      }

      #initial-loader.is-error .initial-loader__bar {
        display: none;
      }

      .initial-loader__retry {
        display: none;
        min-height: 42px;
        margin-top: 18px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        background: #047857;
        color: #fff;
        font: 700 13px/1 system-ui, sans-serif;
        cursor: pointer;
      }

      #initial-loader.is-error .initial-loader__retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .initial-loader__content {
        display: flex;
        width: min(100%, 280px);
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .initial-loader__logo {
        display: grid;
        width: 88px;
        height: 88px;
        place-items: center;
        border: 1px solid rgba(167, 243, 208, 0.8);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 60px rgba(15, 118, 110, 0.16);
      }

      .initial-loader__logo img {
        width: 60px;
        height: 60px;
        object-fit: contain;
      }

      .initial-loader__title {
        margin: 20px 0 0;
        color: #0f172a;
        font: 700 16px/1.4 system-ui, sans-serif;
        letter-spacing: -0.02em;
      }

      .initial-loader__subtitle {
        margin: 5px 0 0;
        color: #64748b;
        font: 400 12px/1.5 system-ui, sans-serif;
      }

      .initial-loader__track {
        position: relative;
        width: 100%;
        height: 4px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(16, 185, 129, 0.12);
      }

      .initial-loader__bar {
        position: absolute;
        inset: 0 auto 0 -38%;
        width: 38%;
        border-radius: inherit;
        background: linear-gradient(90deg, #10b981, #34d399);
        animation: initial-loader-progress 1.15s ease-in-out infinite;
      }

      html.dark #initial-loader {
        background:
          radial-gradient(circle at top, rgba(16, 185, 129, 0.16), transparent 34%),
          linear-gradient(180deg, #101b2a 0%, #0b1220 100%);
      }

      html.dark .initial-loader__logo {
        border-color: rgba(110, 231, 183, 0.22);
        background: rgba(30, 41, 59, 0.92);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }

      html.dark .initial-loader__title { color: #f1f5f9; }
      html.dark .initial-loader__subtitle { color: #94a3b8; }

      @keyframes initial-loader-progress {
        0% { transform: translateX(0); }
        100% { transform: translateX(365%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #initial-loader { transition-duration: 1ms; }
        .initial-loader__bar { animation-duration: 2.4s; }
      }

      /*
       * Keep the first paint deliberately simple on mobile. Older Android
       * Chromium/WebView builds can flicker when a full-screen translucent
       * gradient and an animated layer are composited while JS is starting.
       */
      @media (max-width: 767px) {
        #initial-loader {
          background: #f3fbf6;
          transition-duration: 1ms;
        }
        .initial-loader__logo {
          box-shadow: 0 12px 30px rgba(15, 118, 110, 0.12);
        }
        .initial-loader__bar {
          left: 0;
          width: 58%;
          animation: none;
        }
      }

      html[data-render-mode="compat"] #initial-loader {
        background: #f3fbf6;
        transition-duration: 1ms;
      }

      html[data-render-mode="compat"] .initial-loader__bar {
        left: 0;
        width: 58%;
        animation: none;
      }

      /* Keep dark mode intact even when the mobile compatibility loader runs. */
      html.dark #initial-loader,
      html.dark[data-render-mode="compat"] #initial-loader {
        background:
          radial-gradient(circle at top, rgba(16, 185, 129, 0.16), transparent 34%),
          linear-gradient(180deg, #101b2a 0%, #0b1220 100%);
      }
    </style>
    <!-- Preconnect: browser opens TCP/TLS to Google Fonts servers before CSS requests them -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts via <link> instead of CSS @import — loads in parallel with CSS, not sequentially -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Space+Grotesk:wght@300..700&display=swap" />
    <title>Citra Negara Attendence System</title>
  </head>
  <body class="min-h-full bg-background text-foreground">
    <div id="initial-loader" role="status" aria-live="polite" aria-label="Menyiapkan Citra Negara Attendence System">
      <div class="initial-loader__content">
        <div class="initial-loader__logo">
          <img src="/images/optimized/logo-sma-smk-yatkj-ui.png" alt="Logo Sekolah Citra Negara" width="60" height="60" />
        </div>
        <p class="initial-loader__title">Menyiapkan Citra Negara Attendence System</p>
        <p class="initial-loader__subtitle">Memuat pengalaman sekolahmu...</p>
        <div class="initial-loader__track" aria-hidden="true">
          <span class="initial-loader__bar"></span>
        </div>
        <button class="initial-loader__retry" type="button" onclick="window.__absensiReloadFresh ? window.__absensiReloadFresh() : window.location.reload()">Muat ulang halaman</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        function reloadFreshDocument() {
          try {
            var url = new URL(window.location.href);
            url.searchParams.set("__app_reload", String(Date.now()));
            window.location.replace(url.toString());
          } catch (_) {
            window.location.reload();
          }
        }

        function showInitialLoadError() {
          if (window.__absensiAppReady) return;

          var loader = document.getElementById("initial-loader");
          if (!loader) return;

          loader.className += " is-error";
          var title = loader.querySelector(".initial-loader__title");
          var subtitle = loader.querySelector(".initial-loader__subtitle");
          if (title) title.textContent = "Halaman belum berhasil dimuat";
          if (subtitle) subtitle.textContent = "Periksa koneksi lalu muat ulang halaman.";
        }

        window.__absensiShowInitialLoadError = showInitialLoadError;
        window.__absensiReloadFresh = reloadFreshDocument;
        window.__absensiInitialLoaderTimeout = window.setTimeout(showInitialLoadError, 15000);
      })();
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__absensiShowInitialLoadError && window.__absensiShowInitialLoadError()"></script>
  </body>
</html>
